name: ci
# Every PR runs every test: the hub, each tool (Tender against a real Postgres 17) and the shared-copy check.
# `ci-ok` is the one required check for merging into main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the shared copies are the same everywhere (feedback.py and its test, the outlines of Europe)
        run: |
          for f in tools/tender/app/feedback.py tools/patna-obstanovka/feedback.py tools/ikonomika/app/feedback.py tools/parlament/app/feedback.py tools/naselenie/app/feedback.py tools/obrazovanie/app/feedback.py tools/byudzhet/app/feedback.py; do cmp hub/feedback.py "$f"; done
          for f in tools/tender/tests/test_feedback.py tools/patna-obstanovka/tests/test_feedback.py tools/ikonomika/tests/test_feedback.py tools/parlament/tests/test_feedback.py tools/naselenie/tests/test_feedback.py tools/obrazovanie/tests/test_feedback.py tools/byudzhet/tests/test_feedback.py; do cmp hub/tests/test_feedback.py "$f"; done
          cmp tools/ikonomika/app/static/europe.json tools/tender/app/static/europe.json   # the outlines of Europe: Икономика builds, Тендер copies

  hub:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt pytest httpx2 pillow
      - run: python -m pytest -q

  patna-obstanovka:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/patna-obstanovka } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt pytest httpx2
      - run: python -m pytest -q

  tender:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/tender } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tender_test
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TENDER_TEST_DSN: host=localhost user=postgres password=postgres dbname=tender_test
      TENDER_DATA: /tmp/tender-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      # the database tests skip without TENDER_TEST_DSN; here every one of them must run
      # steps run as `bash -e` without pipefail: without it `| tee` would hide a failed test
      - run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          ! grep -q SKIPPED "$RUNNER_TEMP/pytest.out"

  ikonomika:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/ikonomika } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ikonomika_test
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IKONOMIKA_TEST_DSN: host=localhost user=postgres password=postgres dbname=ikonomika_test
      IKONOMIKA_DATA: /tmp/ikonomika-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt httpx2
      # the database tests skip without IKONOMIKA_TEST_DSN; here every one of them must run
      - run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          ! grep -q SKIPPED "$RUNNER_TEMP/pytest.out"
      # each rule that guards the data is broken on purpose; the tests must notice every one
      - run: python tests/mutations.py

  parlament:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/parlament } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parlament_test
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARLAMENT_TEST_DSN: host=localhost user=postgres password=postgres dbname=parlament_test
      PARLAMENT_DATA: /tmp/parlament-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt httpx2
      # the database tests skip without PARLAMENT_TEST_DSN; here every one of them must run
      - run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          ! grep -q SKIPPED "$RUNNER_TEMP/pytest.out"
      # each rule that guards the data is broken on purpose; the tests must notice every one
      - run: python tests/mutations.py

  nablyudatel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/nablyudatel } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install pytest   # the archive itself needs only the standard library
      - run: python -m pytest -q
      - run: python tests/mutations.py

  naselenie:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/naselenie } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naselenie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NASELENIE_TEST_DSN: host=localhost user=postgres password=postgres dbname=naselenie_test
      NASELENIE_DATA: /tmp/naselenie-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt httpx2
      - run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          ! grep -q SKIPPED "$RUNNER_TEMP/pytest.out"
      - run: python tests/mutations.py

  obrazovanie:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/obrazovanie } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obrazovanie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OBRAZOVANIE_TEST_DSN: host=localhost user=postgres password=postgres dbname=obrazovanie_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          ! grep -q SKIPPED "$RUNNER_TEMP/pytest.out"
      - run: python tests/mutations.py

  byudzhet:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/byudzhet } }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: byudzhet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BYUDZHET_TEST_DSN: host=localhost user=postgres password=postgres dbname=byudzhet_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python -m pytest -q -rs 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          ! grep -q SKIPPED "$RUNNER_TEMP/pytest.out"
      - run: python tests/mutations.py

  ci-ok:
    if: always()
    needs: [shared, hub, patna-obstanovka, tender, ikonomika, parlament, nablyudatel, naselenie, obrazovanie, byudzhet]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
