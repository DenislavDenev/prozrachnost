name = "parity_days"
title_bg = "Дни: старата база срещу общата"
kind = "parity"
gating = false

[[check]]
name = "parity_days_differ"
title_bg = "Дни с различен статус, файл или брой записи"
kind = "parity"
gating = false

[[check]]
