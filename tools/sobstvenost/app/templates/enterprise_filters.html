<form class="ctl"><input type="hidden" name="view" value="enterprises"><label>Принципал <select name="principal"><option value="">Всички</option>{% for p in d.principals %}<option {{ 'selected' if p==d.filters.principal }}>{{ p }}</option>{% endfor %}</select></label><label>Участие <select name="participation"><option value="">Всички</option>{% for k,name in [('direct','Пряко'),('owner_reported','Посочен собственик, непроверена верига'),('unspecified','Без определен вид'),('unknown','Неизвестен процент')] %}<option value="{{ k }}" {{ 'selected' if k==d.filters.participation }}>{{ name }}</option>{% endfor %}</select></label><label>Статус <select name="status"><option value="">Всички</option>{% for s in ['Активно','Неактивно'] %}<option {{ 'selected' if s==d.filters.status }}>{{ s }}</option>{% endfor %}</select></label><label>Име или проверен ЕИК <input name="q" value="{{ d.filters.q }}" type="search"></label><button>Приложи</button></form>
