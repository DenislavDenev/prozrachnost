# The sources of the archive. pipeline.sync_registry() loads this at `migrate`. Every name that the archive writes in
# index.jsonl is a source here: a line of a source missing here cannot be registered (ops.fetch points to ops.source).
# The archive is not shown or distributed, so it has no datasets. stale_after stays empty: the archive loads nothing
# into a landing zone, and its freshness is read from ops.run (archive/run.py, the same rule as before).

