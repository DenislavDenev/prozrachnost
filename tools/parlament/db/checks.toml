# The quality rules of Парламент. Each query returns one row: expected, actual. They run after every step that writes,
# so they are cheap: the files of a sitting are checked against each other before anything of it is written
# (ingest/parse.check), and the database itself refuses a key of an MP on a speech of someone who is not one
# (constraint speech_profile_only_mp_ck).

[[check]]
name = "sitting_has_an_assembly"
title_bg = "Всяко заседание е на събрание"
kind = "not_null"
sql = "SELECT 0, count(*) FROM parlament.sitting WHERE assembly IS NULL"

[[check]]
name = "votes_have_their_files"
title_bg = "Заседание с гласувания има прочетените си файлове"
kind = "reconcile"
sql = "SELECT 0, count(*) FROM parlament.sitting s WHERE s.iv_sha IS NULL AND EXISTS (SELECT FROM parlament.item i WHERE i.sitting = s.id)"

[[check]]
name = "every_mp_has_statistics"
title_bg = "Всеки депутат от поименното гласуване има статистика"
kind = "reconcile"
sql = "SELECT (SELECT count(*) FROM parlament.mp), (SELECT count(*) FROM parlament.mp_stat)"

[[check]]
name = "every_vote_has_group_lines"
title_bg = "Гласувания с поименни гласове в група, но без линия на нито една група (последните 60 дни)"
kind = "reconcile"
sql = "SELECT 0, count(*) FROM parlament.item i JOIN parlament.sitting s ON s.id = i.sitting WHERE s.date >= current_date - 60 AND i.kind = 'vote' AND EXISTS (SELECT FROM parlament.vote v WHERE v.sitting = i.sitting AND v.item = i.no AND v.grp NOT IN ('НЕЗ', 'НЕЧЛ')) AND NOT EXISTS (SELECT FROM parlament.line l WHERE l.sitting = i.sitting AND l.item = i.no)"

[[check]]
name = "profile_of_a_speech_exists"
title_bg = "Профилът на изказване е профил на депутат"
kind = "fk"
sql = "SELECT 0, count(*) FROM (SELECT DISTINCT profile FROM parlament.speech WHERE profile IS NOT NULL) x WHERE NOT EXISTS (SELECT FROM parlament.profile p WHERE p.id = x.profile)"

# the serving layer, judged inside the transaction of the publication
[[check]]
name = "published_votes"
title_bg = "Публикуваните поименни гласове са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM parlament.vote), (SELECT count(*) FROM pub_parlament.vote)"

[[check]]
name = "published_speeches"
title_bg = "Публикуваните изказвания са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM parlament.speech), (SELECT count(*) FROM pub_parlament.speech)"

[[check]]
name = "published_results"
title_bg = "Публикуваният сбор на гласовете „за“ е сборът в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT COALESCE(sum(yes), 0) FROM parlament.item), (SELECT COALESCE(sum(yes), 0) FROM pub_parlament.item)"

[[check]]
name = "published_people"
title_bg = "Публикуваните профили на депутати са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM parlament.profile), (SELECT count(*) FROM pub_parlament.profile)"

