source_url = "https://data.egov.bg/data/view/066b4b04-d81d-444e-a61c-8ca0516079e4"
channel = "api"
licence = "CC0 (условия 1 на data.egov.bg)"
cadence = "годишно, две сесии"
tables = ["pub_obrazovanie.dzi_publication", "pub_obrazovanie.dzi_result", "obrazovanie.dzi_publication", "obrazovanie.dzi_result", "obrazovanie_src.dzi", "obrazovanie_src.dzi_row"]

[[dataset]]
dataset = "obrazovanie.nvo"
