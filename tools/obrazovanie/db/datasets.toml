# The datasets and sources of Образование. pipeline.sync_registry() loads this at `migrate`.
# Whether a dataset may be distributed is decided only in tools/danni/db/licences.toml.

[[dataset]]
dataset = "obrazovanie.nvo7"
title_bg = "НВО VII клас по училища"
description_bg = "Явили се и среден резултат в точки по БЕЛ и математика за всяко училище, сверени по код по НЕИСПУО с регистъра на същата година."
source_org = "Министерство на образованието и науката"
source_url = "https://data.egov.bg/data/view/b56288b6-25aa-4049-9aa6-de2cd4cdabf8"
channel = "api"
licence = "CC0 (условия 1 на data.egov.bg)"
cadence = "годишно"
tables = ["pub_obrazovanie.nvo7_publication", "pub_obrazovanie.school", "pub_obrazovanie.exam_result", "obrazovanie.nvo7_publication", "obrazovanie.school", "obrazovanie.exam_result", "obrazovanie_src.nvo7", "obrazovanie_src.nvo7_row"]

[[dataset]]
dataset = "obrazovanie.register"
title_bg = "Регистър на училищата и детските градини"
description_bg = "Код по НЕИСПУО, име, област, община и населено място на всяко училище и детска градина."
source_org = "Министерство на образованието и науката"
source_url = "https://data.egov.bg/data/view/81b81e76-e6aa-4895-b0b0-e0a9af53742f"
channel = "api"
licence = "CC0 (условия 1 на data.egov.bg)"
cadence = "годишно"
tables = ["obrazovanie_src.register", "obrazovanie_src.register_row"]

[[dataset]]
dataset = "obrazovanie.dzi"
title_bg = "ДЗИ (матури) по училища"
description_bg = "Явили се и средна оценка по предмет за всяко училище, по година, сесия и вид изпит."
