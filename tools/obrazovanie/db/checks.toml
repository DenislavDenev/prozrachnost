title_bg = "Публикуваните резултати от НВО IV и X са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM obrazovanie.nvo_result), (SELECT count(*) FROM pub_obrazovanie.nvo_result)"

[[check]]
