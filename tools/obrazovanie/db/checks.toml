# Judged inside the transaction of a publication, against the new content of the serving layer.
# One that fails rolls the publication back: the pages keep the version they had.
[[check]]
name = "published_exam_result"
title_bg = "Публикуваните резултати от НВО VII са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM obrazovanie.exam_result), (SELECT count(*) FROM pub_obrazovanie.exam_result)"

[[check]]
name = "published_school"
title_bg = "Публикуваните училища в НВО VII са колкото в чистата таблица"
