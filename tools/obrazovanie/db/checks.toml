# The quality rules of Образование. Each query returns one row: expected, actual. They run after every step.
# The checks of one file (two subjects per school, the count of the DZI rows, at most 2% of codes missing from the
# register) are done before the load and refuse the file; the rules here check what is stored.

[[check]]
name = "nvo7_clean_matches_landing"
title_bg = "Резултатите от НВО VII в чистата таблица са колкото в действащите прочити"
kind = "reconcile"
sql = "SELECT (SELECT count(*) FROM obrazovanie_src.nvo7_row r JOIN ops.load l USING (load_id) WHERE l.is_current), (SELECT count(*) FROM obrazovanie.exam_result)"

[[check]]
name = "nvo7_two_subjects"
title_bg = "Всяко училище в НВО VII има точно два предмета"
kind = "reconcile"
sql = "SELECT 0, count(*) FROM obrazovanie.school s WHERE (SELECT count(*) FROM obrazovanie.exam_result e WHERE (e.school_year, e.neispuo) = (s.school_year, s.neispuo)) <> 2"

[[check]]
name = "dzi_clean_matches_landing"
title_bg = "Резултатите от ДЗИ в чистата таблица са колкото в действащите прочити"
kind = "reconcile"
sql = "SELECT (SELECT count(*) FROM obrazovanie_src.dzi_row r JOIN ops.load l USING (load_id) WHERE l.is_current), (SELECT count(*) FROM obrazovanie.dzi_result)"

[[check]]
name = "nvo_clean_matches_landing"
title_bg = "Резултатите от НВО IV и X в чистата таблица са колкото в действащите прочити"
kind = "reconcile"
sql = "SELECT (SELECT count(*) FROM obrazovanie_src.nvo_row r JOIN ops.load l USING (load_id) WHERE l.is_current), (SELECT count(*) FROM obrazovanie.nvo_result)"

[[check]]
name = "status_clean_matches_landing"
title_bg = "Редовете на списъците в чистата таблица са колкото в действащите прочити"
kind = "reconcile"
sql = "SELECT (SELECT count(*) FROM obrazovanie_src.status_row r JOIN ops.load l USING (load_id) WHERE l.is_current), (SELECT count(*) FROM obrazovanie.status_row)"

[[check]]
name = "context_students_sum"
title_bg = "Учениците от I до XII клас в справката са сборът на класовете"
kind = "reconcile"
sql = "SELECT (SELECT COALESCE(sum(grade_1_12_students), 0) FROM obrazovanie.context_publication), (SELECT COALESCE(sum(students), 0) FROM obrazovanie.context_grade WHERE grade BETWEEN 1 AND 12)"

[[check]]
name = "municipality_unmatched"
title_bg = "Училища без община в последната година на НВО VII (на 10 000)"
kind = "unmatched"
tolerance = 50
sql = "SELECT 0, COALESCE(round(10000.0 * count(*) FILTER (WHERE municipality_code IS NULL) / NULLIF(count(*), 0)), 0) FROM obrazovanie.school WHERE school_year = (SELECT max(school_year) FROM obrazovanie.nvo7_publication)"

[[check]]
name = "ekatte_unmatched"
title_bg = "Училища без еднозначен ЕКАТТЕ в последната година на НВО VII (на 10 000)"
kind = "unmatched"
tolerance = 300
sql = "SELECT 0, COALESCE(round(10000.0 * count(*) FILTER (WHERE ekatte IS NULL) / NULLIF(count(*), 0)), 0) FROM obrazovanie.school WHERE school_year = (SELECT max(school_year) FROM obrazovanie.nvo7_publication)"

[[check]]
name = "nvo_municipality_unmatched"
title_bg = "Редове на НВО IV и X без община в последната година (на 10 000)"
kind = "unmatched"
tolerance = 150
sql = "SELECT 0, COALESCE(round(10000.0 * count(*) FILTER (WHERE r.municipality_code IS NULL) / NULLIF(count(*), 0)), 0) FROM obrazovanie.nvo_result r JOIN obrazovanie.nvo_publication p USING (resource) WHERE p.school_year = (SELECT max(school_year) FROM obrazovanie.nvo_publication)"

[[check]]
name = "last_read_rejected"
title_bg = "Ресурси, чието последно четене е отказано"
kind = "drop"
sql = "SELECT 0, count(*) FROM (SELECT DISTINCT ON (source, ref) status FROM ops.load WHERE tool = 'obrazovanie' ORDER BY source, ref, loaded_at DESC, load_id DESC) x WHERE status = 'rejected'"

[[check]]
name = "nvo7_year_expected"
title_bg = "Години, с които НВО VII изостава от очакваната учебна година"
kind = "drop"
sql = "SELECT 0, GREATEST(0, (extract(year FROM current_date)::int - CASE WHEN extract(month FROM current_date) >= 9 THEN 1 ELSE 2 END) - COALESCE(max(left(school_year, 4)::int), 0)) FROM obrazovanie.nvo7_publication"

