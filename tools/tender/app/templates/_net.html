{# Registry links around one node: a lineage tree (default) and the graph. Used by company and person pages. #}
<section class="p s12 links" id="net" data-node="{{ node }}">
  <div class="ph"><div><h2>Свързани лица и дружества</h2>
    <div class="sub">По вписванията в Търговския регистър, до последната връзка. Връзка в регистъра не означава контрол.</div></div>
    <div class="tabs" role="group" aria-label="Изглед"><button data-show="tree" aria-pressed="true">Дърво</button><button data-show="graph" aria-pressed="false">Граф</button></div></div>
  <div class="bar2">
    <div class="tabs" role="group" aria-label="Вид връзки"><button data-view="all" aria-pressed="true">Всички</button><button data-view="ownership" aria-pressed="false">Собственост</button><button data-view="management" aria-pressed="false">Управление</button></div>
    <label class="chk"><input type="checkbox" class="yr-on"> Само действащи през</label>
    <span class="yr"><input type="range" min="2008" max="{{ fresh.eop_last_day.year if fresh.eop_last_day else 2026 }}" value="{{ fresh.eop_last_day.year if fresh.eop_last_day else 2026 }}" disabled aria-label="Година"><output>—</output></span>
    <span class="grow"></span>
    <button class="btn sm expand" type="button">Разгъни всичко</button>
  </div>
  <div class="tree" aria-live="polite"></div>
  <div class="canvas" hidden><svg role="img" aria-label="Граф на свързаните лица и дружества"><g></g></svg><div class="det" aria-live="polite"></div></div>
  <div class="key2">{% include "_net_key.html" %}<span class="cap mut"></span></div>
</section>
