# The quality rules of Тендер. Each query returns one row: expected, actual. The step `publish` runs them after
# the build has become the clean tables; the serving layer follows only when they hold.
# The parsers keep their own checks of one file or one answer (ingest/normalize.py, eop_offers.check()).

[[check]]
name = "contract_suppliers_have_a_contract"
title_bg = "Всеки ред с изпълнител е към договор, който е в таблицата"
kind = "fk"
sql = "SELECT 0, count(*) FROM tender.contract_supplier s WHERE NOT EXISTS (SELECT FROM tender.contract c WHERE c.id = s.contract_id)"

[[check]]
name = "contracts_did_not_drop"
title_bg = "Договорите не са намалели с над 1% спрямо публикуваните (брой над прага)"
kind = "drop"
sql = "SELECT 0, GREATEST(0, (SELECT count(*) FROM pub_tender.contract) - (SELECT count(*) FROM pub_tender.contract) / 100 - (SELECT count(*) FROM tender.contract))"

[[check]]
name = "payments_did_not_drop"
title_bg = "Плащанията не са намалели с над 1% спрямо публикуваните (брой над прага)"
kind = "drop"
sql = "SELECT 0, GREATEST(0, (SELECT count(*) FROM pub_tender.payment) - (SELECT count(*) FROM pub_tender.payment) / 100 - (SELECT count(*) FROM tender.payment))"

[[check]]
name = "amount_eur_only_with_a_value"
title_bg = "Договор без стойност няма сума в евро (липсващото не е нула)"
kind = "not_null"
sql = "SELECT 0, count(*) FROM tender.contract WHERE value_current IS NULL AND value_initial IS NULL AND amount_eur IS NOT NULL"

[[check]]
name = "placed_buyers_have_a_municipality"
title_bg = "Всеки възложител, поставен в община, сочи към община в общите измерения"
kind = "fk"
sql = "SELECT 0, count(*) FROM tender.buyer_place WHERE municipality IS NOT NULL AND municipality_code IS NULL"

[[check]]
name = "org_unmatched"
title_bg = "Фирми с ЕИК, които още не са в общите организации (на 10 000 фирми с ЕИК)"
kind = "unmatched"
tolerance = 300
gating = false
sql = "SELECT 0, COALESCE(round(10000.0 * count(*) FILTER (WHERE org_eik IS NULL) / NULLIF(count(*), 0)), 0) FROM tender.company WHERE eik ~ '^([0-9]{9}|[0-9]{13})$'"

[[check]]
name = "every_token_is_fresh"
title_bg = "Знакът на лице в чистите таблици не е нито номерът му при нас, нито идентификаторът от регистъра"
kind = "unique"
sql = "SELECT 0, count(*) FROM tender.person_token t JOIN tender_src.tr_person p ON substr(t.shown, 3) IN (p.id, p.indent)"

# Judged inside the transaction of a publication, against the new content of the serving layer.
# One that fails rolls the publication back: the pages keep the version they had.

[[check]]
name = "published_contract_rows"
title_bg = "Публикуваните договори са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM tender.contract), (SELECT count(*) FROM pub_tender.contract)"

[[check]]
name = "published_contract_amount"
title_bg = "Публикуваният сбор на договорите в евро е сборът в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT COALESCE(sum(amount_eur), 0) FROM tender.contract), (SELECT COALESCE(sum(amount_eur), 0) FROM pub_tender.contract)"

[[check]]
name = "published_payment_rows"
title_bg = "Публикуваните плащания са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM tender.payment), (SELECT count(*) FROM pub_tender.payment)"

[[check]]
name = "published_payment_amount"
title_bg = "Публикуваният сбор на плащанията в евро е сборът в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT COALESCE(sum(amount_eur), 0) FROM tender.payment), (SELECT COALESCE(sum(amount_eur), 0) FROM pub_tender.payment)"

[[check]]
name = "published_company_rows"
title_bg = "Публикуваните фирми са колкото в чистата таблица"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM tender.company), (SELECT count(*) FROM pub_tender.company)"

[[check]]
name = "shown_roles_only_with_public_money"
title_bg = "Публикувана роля на лице в дружество без договор и без плащане от бюджета"
kind = "publish"
sql = "SELECT 0, count(*) FROM pub_tender.edge e WHERE e.holder_kind = 'person' AND NOT EXISTS (SELECT FROM tender.public_money m WHERE m.node = e.company)"

[[check]]
name = "shown_roles_complete"
title_bg = "Публикуваните роли на лица са точно ролите в дружества с публични пари"
kind = "publish"
sql = "SELECT (SELECT count(*) FROM tender.edge e JOIN tender.public_money m ON m.node = e.company WHERE e.holder_kind = 'person' AND e.holder IS NOT NULL), (SELECT count(*) FROM pub_tender.edge WHERE holder_kind = 'person')"

[[check]]
name = "shown_people_have_a_role"
title_bg = "Публикувано лице или възел на лице без публикувана роля"
kind = "publish"
sql = "SELECT 0, (SELECT count(*) FROM pub_tender.person p WHERE NOT EXISTS (SELECT FROM pub_tender.edge e WHERE e.holder = 'p:' || p.id)) + (SELECT count(*) FROM pub_tender.node n WHERE n.kind IN ('person', 'local_person') AND NOT EXISTS (SELECT FROM pub_tender.edge e WHERE e.holder = n.id)) + (SELECT count(*) FROM pub_tender.search_item s WHERE s.kind = 'person' AND NOT EXISTS (SELECT FROM pub_tender.person p WHERE p.id = s.ref))"

[[check]]
name = "no_key_of_a_person_is_published"
title_bg = "Публикуван знак на лице, който е номерът му при нас, идентификаторът от регистъра или хеш от името"
kind = "publish"
sql = "SELECT 0, (SELECT count(*) FROM pub_tender.person s JOIN tender_src.tr_person p ON s.id IN (p.id, p.indent)) + (SELECT count(*) FROM pub_tender.edge e JOIN tender.edge o ON o.holder = e.holder WHERE e.holder_kind = 'person')"

[[check]]
name = "landed_rows_have_a_load"
title_bg = "Всеки приет ред носи зареждането си (редове без зареждане)"
kind = "not_null"
sql = """SELECT 0, (SELECT count(*) FROM tender_src.eop_file WHERE load_id IS NULL)
  + (SELECT count(*) FROM tender_src.fx_rate WHERE load_id IS NULL)
  + (SELECT count(*) FROM tender_src.tr_deed WHERE status = 'ok' AND load_id IS NULL)
  + (SELECT count(*) FROM tender_src.tr_role WHERE load_id IS NULL)
  + (SELECT count(*) FROM tender_src.eopsvc_offer WHERE load_id IS NULL)
  + (SELECT count(*) FROM tender_src.eopsvc_publication WHERE load_id IS NULL)
  + (SELECT count(*) FROM tender_src.eopsvc_document WHERE load_id IS NULL)
  + (SELECT count(*) FROM tender_src.sebra_payment WHERE load_id IS NULL)"""

[[check]]
name = "the_build_read_the_loaded_files"
title_bg = "Всеки файл на отворените данни, от който е изградено, е действащото зареждане на деня си"
kind = "fk"
sql = "SELECT 0, count(*) FROM tender_src.eop_file f WHERE NOT EXISTS (SELECT FROM ops.load l WHERE l.load_id = f.load_id AND l.is_current AND l.raw_file_id = f.raw_file_id)"

[[check]]
name = "clean_columns_are_described"
title_bg = "Всяка колона на чистите таблици има описание (колони без COMMENT ON)"
kind = "not_null"
sql = "SELECT 0, count(*) FROM pg_class c JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped WHERE c.relnamespace = 'tender'::regnamespace AND c.relkind = 'r' AND col_description(c.oid, a.attnum) IS NULL"

[[check]]
name = "clean_money_has_two_decimals"
title_bg = "Парите в чистите таблици са numeric(20,2), а моментите са със зона (колони с друг тип)"
kind = "not_null"
sql = "SELECT 0, count(*) FROM information_schema.columns WHERE table_schema = 'tender' AND ((data_type = 'numeric' AND numeric_scale IS DISTINCT FROM 2 AND column_name ~ '(^|_)(amount|value|eur|price)(_|$)') OR data_type IN ('timestamp without time zone', 'double precision', 'real', 'money', 'character varying'))"
