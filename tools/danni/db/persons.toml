kind = "registered"
shown_as = "absent"
decided_on = 2026-11-24
basis = "the work table of one file under load; never shown"

[[person]]
column = "pub_subsidii.recipient.person_masked"
kind = "registered"
shown_as = "masked"
decided_on = 2026-11-24
basis = "a natural person or a sole trader with more than 1 250 euro in a year, the threshold under which ДФЗ itself publishes no name: the first name and ***, until two years after the year; at or below the threshold only in pub_subsidii.below_threshold"
