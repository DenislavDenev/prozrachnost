# art. 98: legal entities and, above 1 250 euro in a year, natural persons by name, for two years. Decision 3 (the
# donors) applies: the threshold of the source itself is the line. A natural person or a sole trader above it is a
# row with a masked name until two years after the year; at it or below only in sums. Legal entities by their name.
# A sole trader carries the name of its owner, so it is treated as a natural person, as the tool always did.

[[person]]
column = "subsidii_src.beneficiary.name"
kind = "registered"
shown_as = "masked"
decided_on = 2026-11-24
basis = "the first name of a natural person or the name of an entity, as ДФЗ publishes it (Regulation (EU) 2021/2116, art. 98); a person is shown masked above 1 250 euro in a year and only summed below; an entity in full"

[[person]]
column = "subsidii_src.beneficiary.surname"
kind = "registered"
shown_as = "masked"
decided_on = 2026-11-24
basis = "the last name of a natural person as ДФЗ publishes it; never shown, the mask keeps only the first name"

[[person]]
column = "subsidii_src.payment.name_variant"
kind = "registered"
shown_as = "absent"
decided_on = 2026-11-24
basis = "the name on a payment row when it differs from its block (a dash lost in the source); kept for the fidelity of the landing zone, never shown"

[[person]]
column = "subsidii_src.payment.surname_variant"
kind = "registered"
shown_as = "absent"
decided_on = 2026-11-24
basis = "the last name on a payment row when it differs from its block; never shown"

[[person]]
column = "subsidii_src.line.name"
kind = "registered"
shown_as = "absent"
decided_on = 2026-11-24
basis = "the work table of one file under load, emptied for every file; never shown"

[[person]]
column = "subsidii_src.line.surname"
kind = "registered"
shown_as = "absent"
decided_on = 2026-11-24
basis = "the work table of one file under load; never shown"

[[person]]
column = "subsidii_src.line.o_name"
kind = "registered"
shown_as = "absent"
decided_on = 2026-11-24
basis = "the work table of one file under load; never shown"

[[person]]
