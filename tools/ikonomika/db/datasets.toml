# The datasets, sources and indicators of Икономика. pipeline.sync_registry() loads this at `migrate`.
# Whether a dataset may be shown or distributed is decided only in tools/danni/db/licences.toml.
# Every indicator id of db/ref/indicators.csv, ingest/ecb.py, ingest/mf.py and the two of the BNB has an entry here
# (tests/test_registry.py).

[[dataset]]
dataset = "ikonomika.series"
title_bg = "Показателите на Икономика"
description_bg = "Числата на всички показатели: Eurostat, ЕЦБ, прогнозите на МФ и валутните курсове на БНБ, по серия и период. Източникът на всеки показател е в core.indicator."
source_org = "Eurostat, ЕЦБ, Министерство на финансите, БНБ"
channel = "api"
licence = "по източника на показателя"
cadence = "всеки ден"
tables = ["pub_ikonomika.series", "pub_ikonomika.dim_label", "pub_ikonomika.source_state", "pub_ikonomika.hold", "pub_ikonomika.change_count", "ikonomika.series", "ikonomika.observation", "ikonomika.dim_label", "ikonomika.source_state", "ikonomika_src.observation", "ikonomika_src.label", "ikonomika_src.ref_label"]

[[dataset]]
dataset = "ikonomika.eurostat"
title_bg = "Eurostat: инфлация, БВП, заетост, финанси, външен сектор"
description_bg = "43 показателя от Statistics API на Eurostat (JSON-stat 2.0), всеки по реда си в db/ref/indicators.csv."
source_org = "Eurostat"
source_url = "https://ec.europa.eu/eurostat/web/main/data/web-services"
channel = "api"
licence = "CC BY 4.0"
licence_url = "https://ec.europa.eu/eurostat/about-us/policies/copyright"
cadence = "всеки ден"

[[dataset]]
dataset = "ikonomika.ecb"
title_bg = "ЕЦБ: лихви на банките, кредити и депозити"
description_bg = "Лихвите по нови кредити и депозити (MIR) и салдата на кредитите и депозитите (BSI) за България и еврозоната."
source_org = "Европейска централна банка"
source_url = "https://data.ecb.europa.eu/"
channel = "api"
licence = "свободно повторно използване с посочване на източника"
licence_url = "https://www.ecb.europa.eu/home/disclaimer/html/index.en.html"
cadence = "всеки ден"

[[dataset]]
dataset = "ikonomika.mf"
title_bg = "Макроикономическите прогнози на Министерството на финансите"
description_bg = "Всички прогнози от 11.2020 насам, по една таблица на прогноза."
source_org = "Министерство на финансите"
source_url = "https://data.egov.bg/data/view/335961f9-5027-4e5d-bbda-667464a72b37"
channel = "api"
licence = "CC0"
cadence = "при нова прогноза"

[[dataset]]
dataset = "ikonomika.bnb"
title_bg = "Валутните курсове на БНБ"
description_bg = "До 31.12.2025 в лева за посочения брой единици валута (от 1991); от 01.01.2026 референтните курсове на ЕЦБ към еврото, както ги публикува БНБ."
source_org = "Българска народна банка"
source_url = "https://www.bnb.bg/Statistics/StExternalSector/StExchangeRates/StERForeignCurrencies/index.htm"
channel = "file"
licence = "не е прочетен"
cadence = "работни дни"

[[unit]]
unit_code = "percent"
name_bg = "процент"

[[unit]]
unit_code = "million-EUR"
name_bg = "милиона евро"

[[unit]]
unit_code = "thousand-person"
name_bg = "хиляди души"

[[unit]]
unit_code = "per-mille"
name_bg = "на хиляда"

[[unit]]
unit_code = "currency-per-EUR"
name_bg = "единици валута за 1 евро"

[[unit]]
unit_code = "BGN-per-units"
name_bg = "лева за посочения брой единици валута"

[[unit]]
unit_code = "by-row"
name_bg = "по реда: единицата е в измеренията на източника (unit, currency, indic)"

# every source keeps only its latest accepted answer in the landing zone: a source is read whole every day
[[source]]
source = "eurostat"
title_bg = "Eurostat, Statistics API"
url = "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
channel = "api"
dataset = "ikonomika.eurostat"
cadence = "всеки ден 10:30 UTC"
stale_after = "3 days"
landing = "latest"

[[source]]
source = "ecb"
title_bg = "ЕЦБ, Data Portal API"
url = "https://data-api.ecb.europa.eu/service/data"
channel = "api"
dataset = "ikonomika.ecb"
cadence = "всеки ден"
stale_after = "3 days"
landing = "latest"

[[source]]
