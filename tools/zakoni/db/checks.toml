# The quality rules of Закони и решения: rows in ops.check_rule, results in ops.check_result.
# A rule returns one row: (expected, actual); it holds when |actual - expected| <= tolerance. A gating rule that fails
# stops the publication: the pages keep the version they have. The rules without SQL are counted by the code
# (pipeline.record_check): the parser and the load know the numbers of the file.
# The rules of one file (the legend, the fields and their types, a repeated key) are in the parser: a file that breaks
# them is refused before anything is written.

