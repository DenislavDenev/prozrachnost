# ---------------------------------------------------------------- the clean tables

[[check]]
name = "every_record_built"
title_bg = "Всеки запис от действащите четения е точно един ред в чистите таблици"
kind = "reconcile"
dataset = "zakoni.amc"
sql = """WITH cur AS (SELECT load_id FROM ops.load WHERE tool = 'zakoni' AND is_current)
  SELECT (SELECT count(*) FROM zakoni_src.pris_act JOIN cur USING (load_id)) + (SELECT count(*) FROM zakoni_src.consultation JOIN cur USING (load_id))
       + (SELECT count(*) FROM zakoni_src.strategy_doc JOIN cur USING (load_id)) + (SELECT count(*) FROM zakoni_src.impact_contract JOIN cur USING (load_id)),
         (SELECT count(*) FROM zakoni.act) + (SELECT count(*) FROM zakoni.consultation) + (SELECT count(*) FROM zakoni.strategy_doc)
       + (SELECT count(*) FROM zakoni.impact_contract)"""

[[check]]
name = "consultation_closes_before_opens"
title_bg = "Консултации, които приключват преди да са открити"
kind = "not_null"
dataset = "zakoni.amc"
sql = "SELECT 0, count(*) FROM zakoni.consultation WHERE closes < opened OR days < 1"

[[check]]
name = "date_in_the_future"
title_bg = "Актове и консултации с дата в бъдещето"
kind = "not_null"
dataset = "zakoni.amc"
sql = """SELECT 0, (SELECT count(*) FROM zakoni.act WHERE accepted > current_date + 1)
               + (SELECT count(*) FROM zakoni.consultation WHERE opened > current_date + 1)"""

[[check]]
name = "act_before_1944"
title_bg = "Актове с дата преди 1944 г."
kind = "not_null"
dataset = "zakoni.amc"
sql = "SELECT 0, count(*) FROM zakoni.act WHERE accepted < DATE '1944-01-01'"

[[check]]
name = "act_without_type"
title_bg = "Актове без вид"
kind = "not_null"
dataset = "zakoni.amc"
sql = "SELECT 0, count(*) FROM zakoni.act WHERE act_type = ''"

[[check]]
name = "gazette_year_out_of_range"
title_bg = "Показана година на Държавен вестник извън 1944 до следващата година или повече от година преди акта"
kind = "not_null"
dataset = "zakoni.amc"
sql = """SELECT 0, count(*) FROM zakoni.act WHERE gazette_year IS NOT NULL
  AND (gazette_year < 1944 OR gazette_year > extract(year FROM current_date) + 1 OR gazette_year < year - 1)"""

[[check]]
name = "relation_to_itself"
title_bg = "Показана връзка на акт със себе си"
kind = "fk"
dataset = "zakoni.amc"
sql = "SELECT 0, count(*) FROM zakoni.act_relation WHERE pris_id = related_pris_id"

[[check]]
name = "short_term_indicator"
title_bg = "Индикаторът за кратък срок е само за срок под 30 дни, открит от 04.11.2016, и мотивът е посочен само с текст"
kind = "not_null"
dataset = "zakoni.amc"
sql = """SELECT 0, count(*) FROM zakoni.consultation
  WHERE (short_term_applies AND (days >= 30 OR opened < DATE '2016-11-04')) OR (reason_given AND short_term_reason IS NULL)"""

[[check]]
name = "institution_municipality_known"
title_bg = "Всяка община в db/ref/institution_municipality.csv е община в core.municipality (по ЕИК)"
kind = "fk"
dataset = "zakoni.amc"
sql = """SELECT 0, count(*) FROM zakoni_src.institution_municipality im
  WHERE im.load_id IN (SELECT load_id FROM ops.load WHERE tool = 'zakoni' AND is_current)
    AND NOT EXISTS (SELECT 1 FROM core.municipality m WHERE m.eik = im.municipality_eik)"""

[[check]]
name = "municipal_without_municipality"
title_bg = "Общинските консултации без община са над 2%"
kind = "unmatched"
dataset = "zakoni.amc"
sql = """SELECT 0, CASE WHEN count(*) FILTER (WHERE municipality_code IS NULL AND institution_name IS NOT NULL) > 0.02 * count(*)
                       THEN count(*) FILTER (WHERE municipality_code IS NULL AND institution_name IS NOT NULL) ELSE 0 END
  FROM zakoni.consultation WHERE level = 'Общинско'"""

# ---------------------------------------------------------------- the publication (inside its transaction, against the new content)

[[check]]
name = "published_rows"
title_bg = "Публикуваните актове, връзки, консултации, документи на консултациите и стратегически документи не са колкото в чистите таблици"
kind = "publish"
dataset = "zakoni.amc"
sql = """SELECT (SELECT count(*) FROM zakoni.act) + (SELECT count(*) FROM zakoni.consultation) + (SELECT count(*) FROM zakoni.consultation_file)
              + (SELECT count(*) FROM zakoni.strategy_doc) + (SELECT count(*) FROM zakoni.act_relation),
         (SELECT count(*) FROM pub_zakoni.act) + (SELECT count(*) FROM pub_zakoni.consultation) + (SELECT count(*) FROM pub_zakoni.consultation_file)
              + (SELECT count(*) FROM pub_zakoni.strategy_doc) + (SELECT count(*) FROM pub_zakoni.act_relation)"""

[[check]]
name = "published_municipality"
title_bg = "Публикувана общинска консултация без община, която чистите таблици имат"
kind = "publish"
dataset = "zakoni.amc"
sql = "SELECT (SELECT count(municipality_code) FROM zakoni.consultation), (SELECT count(municipality_id) FROM pub_zakoni.consultation)"

