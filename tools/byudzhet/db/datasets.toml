# The datasets and sources of Бюджет. pipeline.sync_registry() loads this at `migrate`.
# Whether a dataset may be shown or distributed is decided only in tools/danni/db/licences.toml.
# The registrations per municipality (for "per person") are not read here: they are Население's (naselenie.grao).

[[dataset]]
dataset = "byudzhet.mf"
title_bg = "Изпълнение на бюджета, КФП, фискален резерв и показатели на общините"
description_bg = "Таблиците на Министерството на финансите в data.egov.bg: държавен бюджет и КФП по месеци, фискален резерв, общински дълг и финансови показатели на общините по тримесечия."
source_org = "Министерство на финансите"
source_url = "https://data.egov.bg"
channel = "api"
licence = "CC0 (условия за ползване 1 на data.egov.bg)"
cadence = "месечно (бюджет, КФП, резерв); тримесечно (общини)"
tables = ["pub_byudzhet.report", "pub_byudzhet.state_line", "pub_byudzhet.kfp_value", "pub_byudzhet.reserve_line",
          "pub_byudzhet.municipal_value", "pub_byudzhet.source_state", "pub_byudzhet.problem",
          "byudzhet.report", "byudzhet.state_line", "byudzhet.kfp_value", "byudzhet.reserve_line", "byudzhet.municipal_value",
          "byudzhet.known_gap", "byudzhet_src.egov_catalog", "byudzhet_src.egov_file", "byudzhet_src.egov_row"]

[[source]]
source = "egov-catalog"
title_bg = "Каталозите на наборите на МФ"
